<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трекер учебных задач</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 30px;
        }

        h1 {
            color: #333;
            margin-bottom: 24px;
            font-size: 28px;
            text-align: center;
        }

        .add-form {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }

        .add-form input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .add-form input:focus {
            outline: none;
            border-color: #667eea;
        }

        .add-form input[type="number"] {
            max-width: 100px;
        }

        .add-form button {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        .add-form button:hover {
            background: #5568d3;
        }

        .filters {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .filter-btn {
            flex: 1;
            padding: 10px;
            background: #f5f5f5;
            border: 2px solid transparent;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .filter-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .stats {
            background: #f8f9fa;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-around;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }

        .task-list {
            list-style: none;
        }

        .task-item {
            background: #f8f9fa;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s;
        }

        .task-item:hover {
            background: #f0f0f0;
        }

        .task-item.completed {
            opacity: 0.6;
        }

        .task-item.completed .task-name {
            text-decoration: line-through;
            color: #999;
        }

        .task-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .task-info {
            flex: 1;
        }

        .task-name {
            font-size: 16px;
            color: #333;
            margin-bottom: 4px;
        }

        .task-hours {
            font-size: 13px;
            color: #666;
        }

        .delete-btn {
            padding: 8px 16px;
            background: #ff4757;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .delete-btn:hover {
            background: #ee5a6f;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 Трекер учебных задач</h1>
        
        <div class="add-form">
            <input type="text" id="taskName" placeholder="Название задачи">
            <input type="number" id="taskHours" placeholder="Часы" min="0.5" step="0.5">
            <button onclick="addTask()">Добавить</button>
        </div>

        <div class="filters">
            <button class="filter-btn active" onclick="setFilter('all')">Все</button>
            <button class="filter-btn" onclick="setFilter('active')">Активные</button>
            <button class="filter-btn" onclick="setFilter('completed')">Готовые</button>
        </div>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-value" id="totalHours">0</div>
                <div class="stat-label">Всего часов</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="completedHours">0</div>
                <div class="stat-label">Выполнено часов</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="progress">0%</div>
                <div class="stat-label">Прогресс</div>
            </div>
        </div>

        <ul class="task-list" id="taskList"></ul>
    </div>

    <script>
        let tasks = [
            { id: 1, name: 'Чтение', hours: 2, completed: true },
            { id: 2, name: 'Практика', hours: 4, completed: false },
            { id: 3, name: 'Повторение', hours: 2, completed: false }
        ];
        let currentFilter = 'all';
        let nextId = 4;

        function addTask() {
            const nameInput = document.getElementById('taskName');
            const hoursInput = document.getElementById('taskHours');
            
            const name = nameInput.value.trim();
            const hours = parseFloat(hoursInput.value);

            if (!name) {
                alert('Введите название задачи');
                return;
            }

            if (!hours || hours <= 0) {
                alert('Введите корректное количество часов');
                return;
            }

            tasks.push({
                id: nextId++,
                name: name,
                hours: hours,
                completed: false
            });

            nameInput.value = '';
            hoursInput.value = '';
            
            renderTasks();
        }

        function deleteTask(id) {
            tasks = tasks.filter(task => task.id !== id);
            renderTasks();
        }

        function toggleTask(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                renderTasks();
            }
        }

        function setFilter(filter) {
            currentFilter = filter;
            
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            renderTasks();
        }

        function renderTasks() {
            const taskList = document.getElementById('taskList');
            
            let filteredTasks = tasks;
            if (currentFilter === 'active') {
                filteredTasks = tasks.filter(t => !t.completed);
            } else if (currentFilter === 'completed') {
                filteredTasks = tasks.filter(t => t.completed);
            }

            if (filteredTasks.length === 0) {
                taskList.innerHTML = '<div class="empty-state">Нет задач для отображения</div>';
            } else {
                taskList.innerHTML = filteredTasks.map(task => `
                    <li class="task-item ${task.completed ? 'completed' : ''}">
                        <input 
                            type="checkbox" 
                            class="task-checkbox" 
                            ${task.completed ? 'checked' : ''} 
                            onchange="toggleTask(${task.id})"
                        >
                        <div class="task-info">
                            <div class="task-name">${task.name}</div>
                            <div class="task-hours">${task.hours} ч</div>
                        </div>
                        <button class="delete-btn" onclick="deleteTask(${task.id})">Удалить</button>
                    </li>
                `).join('');
            }

            updateStats();
        }

        function updateStats() {
            const totalHours = tasks.reduce((sum, task) => sum + task.hours, 0);
            const completedHours = tasks
                .filter(task => task.completed)
                .reduce((sum, task) => sum + task.hours, 0);
            const progress = totalHours > 0 ? Math.round((completedHours / totalHours) * 100) : 0;

            document.getElementById('totalHours').textContent = totalHours;
            document.getElementById('completedHours').textContent = completedHours;
            document.getElementById('progress').textContent = progress + '%';
        }

        document.getElementById('taskName').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('taskHours').focus();
            }
        });

        document.getElementById('taskHours').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addTask();
            }
        });

        renderTasks();
    </script>
</body>
</html>
